<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TTT Settings</title>
    <style>
      :root {
        color-scheme: light;
        --text: #111318;
        --muted: #5c6470;
        --border: #d8dde5;
        --accent: #2458f5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 24px 48px;
        background: #fff;
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
      }
      .shell { max-width: 560px; margin: 0 auto; }
      .masthead { height: 96px; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
      .wordmark { color: var(--text); font-size: 24px; font-weight: 700; letter-spacing: -0.07em; }
      .intro { padding: 36px 0 32px; }
      h1 { margin: 0 0 8px; font-size: 30px; line-height: 38px; font-weight: 600; letter-spacing: -0.035em; }
      p { margin: 0; color: var(--muted); line-height: 24px; }
      fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
      .field { display: flex; flex-direction: column; gap: 10px; }
      .field + .field { margin-top: 24px; }
      label { font-size: 14px; line-height: 20px; font-weight: 500; }
      input[type="text"], input[type="password"] {
        width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--border);
        border-radius: 8px; background: #fff; color: var(--text); font: inherit;
      }
      input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .hint { font-size: 13px; line-height: 20px; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 24px 0; font-weight: 400; }
      input[role="switch"] {
        appearance: none; margin: 0; width: 38px; height: 22px; padding: 3px; flex-shrink: 0;
        background: #9ba3b0; border: 0; border-radius: 999px; cursor: pointer;
      }
      input[role="switch"]::after { content: ""; display: block; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
      input[role="switch"]:checked { background: var(--accent); }
      input[role="switch"]:checked::after { transform: translateX(16px); }
      .actions { display: flex; align-items: center; gap: 16px; padding-top: 8px; }
      button { height: 42px; padding: 0 18px; border: 0; border-radius: 7px; background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
      button:hover { background: #1645d8; }
      button:disabled { opacity: 0.55; cursor: default; }
      #status { color: var(--muted); font-size: 13px; line-height: 20px; }
      @media (max-width: 440px) {
        .masthead { height: 72px; }
        .intro { padding-top: 24px; }
        .actions { flex-wrap: wrap; gap: 12px; }
      }
    </style>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
